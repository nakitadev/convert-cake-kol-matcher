services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: convert-cake-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - APIFY_API_TOKEN=${APIFY_API_TOKEN:-}
      - GEMINI_EMBEDDING_MODEL=${GEMINI_EMBEDDING_MODEL:-gemini-embedding-2}
      - GEMINI_LLM_MODEL=${GEMINI_LLM_MODEL:-gemini-3.5-flash-lite}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-https://cloud.langfuse.com}
    env_file:
      - path: ./.env
        required: false
    restart: unless-stopped
    networks:
      - convert-cake-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: convert-cake-frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - convert-cake-network

networks:
  convert-cake-network:
    driver: bridge
